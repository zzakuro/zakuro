<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakuro's Archive</title>
    <meta name="description" content="Zakuro's Archive — an index of PC game releases, metadata and download mirrors." />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zakuro's Archive" />
    <meta property="og:title" content="Zakuro's Archive" />
    <meta property="og:description" content="An index of PC game releases, metadata and download mirrors." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f43f5e'/%3E%3Cstop offset='1' stop-color='%23be123c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Verdana,Arial,sans-serif' font-size='38' font-weight='900' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E"
    />
    <!-- Warm the connections to the image hosts up front (covers, screenshots, hero art). -->
    <link rel="preconnect" href="https://cdn.akamai.steamstatic.com" crossorigin />
    <link rel="preconnect" href="https://shared.akamai.steamstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.akamai.steamstatic.com" />
    <link rel="dns-prefetch" href="https://shared.akamai.steamstatic.com" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default palette.
      try {
        var t = localStorage.getItem("zakuro-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
